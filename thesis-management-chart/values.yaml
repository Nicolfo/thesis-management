frontend:
  image:
    name: registry.nicolfo.it/thesis-management/frontend
    tag: "1.1.4"


backend:
  image:
    name: registry.nicolfo.it/thesis-management/backend
    tag: "1.0.1"


ingress:
  ingressClassName: traefik
  host: thesis-management.nicolfo.it

cluster:
  type: postgresql
  mode: standalone

  version:
    postgresql: "17"
  cluster:
    enableSuperuserAccess: true
    initdb:
      database: thesis-management
    monitoring:
      enabled: false
    instances: 1
    annotations:
      helm.sh/resource-policy: keep
  backups:
    enabled: false