apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: thesis-management-ingress
spec:
  ingressClassName: {{.Values.ingress.ingressClassName}}
  rules:
    - host: {{.Values.ingress.host}}
      http:
        paths:
          - path: /API
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80