plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.cloud.tools.jib' version '3.4.0'
	id "org.sonarqube" version "4.4.1.3373"
	id 'jacoco'
}

group = 'it.polito.se2.g04'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

// Security overrides on top of the Spring Boot BOM
// tomcat-embed-core >= 10.1.58: CVE-2025-24813, CVE-2026-41293, CVE-2026-43512, CVE-2026-43515, CVE-2026-65182, CVE-2026-65905, CVE-2026-68525
ext['tomcat.version'] = '10.1.61'
// jackson >= 2.21.7: CVE-2026-68497, CVE-2026-89425, CVE-2026-91776, CVE-2026-91777
ext['jackson-bom.version'] = '2.21.8'
// postgresql JDBC >= 42.7.12: CVE-2024-1597, CVE-2026-42198, CVE-2026-54291
ext['postgresql.version'] = '42.7.14'

dependencies {
	annotationProcessor("org.springframework.boot:spring-boot-configuration-processor")
	implementation 'org.keycloak:keycloak-admin-client:26.0.12'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	implementation 'com.nimbusds:nimbus-jose-jwt'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	testImplementation 'com.h2database:h2:2.1.214'
}

tasks.named('test') {
	useJUnitPlatform()
}
jib{
	// Ubuntu 24.04 (noble) JRE 17 base, same OS line as before; the default 17-jre tag
	// moved to Ubuntu 26.04, which ships a Go binary (/usr/bin/pebble) with HIGH stdlib CVEs
	from{image="eclipse-temurin:17-jre-noble"}
	container{
		ports=["8080"]
	}
	to{image="nicolfo/thesis-management:final-sprint-1.1"}
}

jacoco {
	toolVersion="0.8.7"
	reportsDirectory = file("${project.projectDir}/testReports")
}
tasks.test{
	finalizedBy("jacocoTestReport")
}
tasks.jacocoTestReport {
	reports {
		xml.required = true
		html.required = false
	}
}

sonar {
	properties {
		property "sonar.projectKey", "Nicolfo_thesis-management"
		property "sonar.organization", "nicolfo"
		property "sonar.host.url", "https://sonarcloud.io"
	}
}