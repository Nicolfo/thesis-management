plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.9'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.cloud.tools.jib' version '3.4.0'
	id "org.sonarqube" version "4.4.1.3373"
	id 'jacoco'
}

group = 'it.polito.se2.g04'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

// Security overrides on top of the Spring Boot BOM
// Jackson 2 is still pulled in by keycloak-admin-client and jjwt-jackson (Boot 4 itself uses Jackson 3);
// jackson 2 >= 2.21.8: CVE-2026-54512, CVE-2026-54513, CVE-2026-68494
ext['jackson-2-bom.version'] = '2.21.8'
// keycloak-admin-client runs on RESTEasy 6.2 (Jakarta REST 3.1); keep the API it was built for instead of Boot 4's 4.0
ext['jakarta-ws-rs.version'] = '3.1.0'

dependencies {
	annotationProcessor("org.springframework.boot:spring-boot-configuration-processor")
	implementation 'org.keycloak:keycloak-admin-client:26.0.12'
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
	implementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
	implementation 'com.nimbusds:nimbus-jose-jwt'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	testImplementation 'com.h2database:h2'
}

tasks.named('test') {
	useJUnitPlatform()
}
jib{
	// Ubuntu 24.04 (noble) JRE 17 base, same OS line as before; the default 17-jre tag
	// moved to Ubuntu 26.04, which ships a Go binary (/usr/bin/pebble) with HIGH stdlib CVEs
	from{image="eclipse-temurin:17-jre-noble"}
	container{
		ports=["8080"]
	}
	to{image="nicolfo/thesis-management:final-sprint-1.1"}
}

jacoco {
	toolVersion="0.8.7"
	reportsDirectory = file("${project.projectDir}/testReports")
}
tasks.test{
	finalizedBy("jacocoTestReport")
}
tasks.jacocoTestReport {
	reports {
		xml.required = true
		html.required = false
	}
}

sonar {
	properties {
		property "sonar.projectKey", "Nicolfo_thesis-management"
		property "sonar.organization", "nicolfo"
		property "sonar.host.url", "https://sonarcloud.io"
	}
}